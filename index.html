<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المدير المالي</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>المدير المالي</h1>
      <hr />
      <nav id="navList" aria-label="شريط التنقل">
        <ul>
          <li><button id="addAmountBTN">إضافة مبلغ مالي</button></li>
          <li><button id="addTransactionBTN">إضافة معاملة</button></li>
          <li><button id="showReport">عرض التقرير المفصل</button></li>
        </ul>
      </nav>
    </header>
    <main>
      <div id="box">
        <div id="amountInfo"></div>
        <hr id="hr" style="display: none" />
        <div id="box2">
          <h3>آخر المعاملات المالية</h3>
          <table id="lastTransactionsTable">
            <caption>
              المعاملات المالية
            </caption>
            <thead>
              <tr>
                <th>اسم المعاملة</th>
                <th>تاريخ إجراء المعاملة</th>
                <th>مبلغ المعاملة</th>
                <th>المبلغ المتبقي</th>
              </tr>
            </thead>
            <tbody id="lastTransactions"></tbody>
          </table>
        </div>
        <div style="display: none" id="report">
          <h1>التقرير المفصل</h1>

          <table id="transactionTable">
            <caption>
              المعاملات المالية
            </caption>
            <thead>
              <tr>
                <th>رقم المعاملة</th>
                <th>اسم المعاملة</th>
                <th>تاريخ إجراء المعاملة</th>
                <th>مبلغ المعاملة</th>
                <th>المبلغ الأصلي قبل إجراء المعاملة</th>
                <th>المبلغ المتبقي</th>
              </tr>
            </thead>
            <tbody id="allTransactions"></tbody>
          </table>
          <button id="clos">إغلاق</button>
        </div>
      </div>
      <form id="addAmount">
        <h3>إضافة مبلغ</h3>
        <div>
          <label for="amountName">اسم المبلغ</label>
          <input type="text" name="amountName" id="amountName" required />
        </div>
        <div>
          <label for="amountInput">المبلغ</label>
          <input
            type="number"
            name="amountInput"
            id="amountInput"
            step="50"
            required
          />
        </div>
        <div>
          <label for="amountDate">التاريخ</label>
          <input type="date" name="amountDate" id="amountDate" required />
        </div>
        <div>
          <label for="doneAddAmount">إضافة</label>
          <input
            type="submit"
            id="doneAddAmount"
            name="doneAddAmount"
            value="إضافة المبلغ"
          />
        </div>
        <input type="button" class="cancelBTN" value="إلغاء" />
      </form>

      <form id="addTransaction">
        <h3>إضافة معاملة</h3>
        <div>
          <label for="transactionName">اسم المعاملة</label>
          <input
            type="text"
            name="transactionName"
            id="transactionName"
            class="values"
            required
          />
        </div>
        <div>
          <label for="transactionAmount">مبلغ المعاملة</label>
          <input
            type="number"
            name="transactionAmount"
            id="transactionAmount"
            class="values"
            step="50"
            required
          />
        </div>
        <div>
          <label for="transactionDate">تاريخ المعاملة</label>
          <input
            type="date"
            name="transactionDate"
            id="transactionDate"
            required
          />
        </div>
        <div>
          <label for="doneAddTransaction">إضافة</label>
          <input
            type="submit"
            id="doneAddTransaction"
            name="doneAddTransaction"
            value="إضافة المعاملة"
          />
        </div>
        <input type="button" class="cancelBTN" value="إلغاء" />
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
